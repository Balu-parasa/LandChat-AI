services:
  # Backend API
  - type: web
    name: landchat-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set to your MongoDB Atlas connection string in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set to your Gemini API key in Render dashboard

  # Frontend Static Site
  - type: web
    name: landchat-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your deployed Backend URL (e.g. https://landchat-backend.onrender.com/api)
